<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06306F"/>
      <stop offset="0.48" stop-color="#0B54B4"/>
      <stop offset="1" stop-color="#3BBDF9"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.26" cy="0.20" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#sheen)"/>

  <!-- maskable 安全区 ~80%：缩放 Ψ -->
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <text x="256" y="286"
          text-anchor="middle"
          dominant-baseline="central"
          font-size="340"
          font-family="Georgia, 'Times New Roman', 'Noto Serif', 'DejaVu Serif', serif"
          font-weight="700"
          fill="#ffffff"
          fill-opacity="0.28"
          filter="url(#soft)">Ψ</text>
    <text x="256" y="286"
          text-anchor="middle"
          dominant-baseline="central"
          font-size="340"
          font-family="Georgia, 'Times New Roman', 'Noto Serif', 'DejaVu Serif', serif"
          font-weight="700"
          fill="#ffffff">Ψ</text>
  </g>
</svg>
