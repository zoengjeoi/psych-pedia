<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06306F"/>
      <stop offset="0.48" stop-color="#0B54B4"/>
      <stop offset="1" stop-color="#3BBDF9"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.26" cy="0.20" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#041A3F" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- 柔光层：真实希腊字母 Ψ (U+03A8) -->
  <text x="256" y="286"
        text-anchor="middle"
        dominant-baseline="central"
        font-size="340"
        font-family="Georgia, 'Times New Roman', 'Noto Serif', 'DejaVu Serif', serif"
        font-weight="700"
        fill="#ffffff"
        fill-opacity="0.28"
        filter="url(#soft)">Ψ</text>

  <!-- 主字符：真实 Ψ -->
  <text x="256" y="286"
        text-anchor="middle"
        dominant-baseline="central"
        font-size="340"
        font-family="Georgia, 'Times New Roman', 'Noto Serif', 'DejaVu Serif', serif"
        font-weight="700"
        fill="#ffffff">Ψ</text>
</svg>
