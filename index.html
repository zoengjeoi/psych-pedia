<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psych-Pedia | 精神科临床速查百科</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Fraunces', 'Noto Serif SC', 'Georgia', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              medical: {
                dark: '#0f1115',        // 页面底层(中性纯色,清爽)
                darkAlt: '#12151b',
                panel: '#161b22',       // 侧栏 / 顶栏
                surface: '#1e232b',     // 卡片
                surfaceAlt: '#1e293b',  // 卡片 hover / 内嵌块
                line: '#1e293b',        // 深色边框线
                primary: '#0ea5e9',     // 天青 - 品牌锚点 / 交互
                primaryBright: '#56c1ff',
                primaryDeep: '#075ea8', // 深蓝层级
                accent: '#f5a524',      // 琥珀金 - 高亮
                accentBright: '#fbbf24',
                violet: '#8b5cf6',      // 紫罗兰 - 受体 / 假说
                teal: '#14b8a6',        // 青绿 - 市场 / 肝酶
                success: '#10b981',
                danger: '#ef4444',
                text: '#eef3fb',
                muted: '#94a3b8'
              }
            },
            animation: {
              'fade-in': 'fade-in .5s ease-out both',
              'fade-in-up': 'fade-in-up .55s cubic-bezier(.16,1,.3,1) both',
              'float': 'float 6s ease-in-out infinite',
              'glow-pulse': 'glow-pulse 4s ease-in-out infinite',
            },
            keyframes: {
              'fade-in': {
                'from': { opacity: '0' },
                'to': { opacity: '1' },
              },
              'fade-in-up': {
                'from': { opacity: '0', transform: 'translateY(10px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              'glow-pulse': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '.55' },
              },
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0B54B4">
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-medical-dark dark:text-medical-text transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
